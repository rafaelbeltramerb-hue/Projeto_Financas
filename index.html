<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Controle Financeiro Compartilhado</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: { 
              50: '#eep2ff',
              100: '#e0e7ff',
              500: '#6366f1', 
              600: '#4f46e5',
              700: '#4338ca' 
            }
          }
        }
      }
    }
  </script>
  <style>
    .glass-card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(226, 232, 240, 0.8);
    }
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #f1f5f9;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen font-sans pb-12">

  <header class="bg-white border-b border-slate-200 sticky top-0 z-30">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="p-2 bg-brand-500 text-white rounded-xl shadow-md shadow-brand-500/20">
          <i data-lucide="wallet" class="w-6 h-6"></i>
        </div>
        <div>
          <h1 class="text-lg font-bold text-slate-900 leading-tight">Controle Financeiro</h1>
          <p class="text-xs text-slate-500">Gestão Compartilhada Rápida</p>
        </div>
      </div>

      <div class="flex items-center gap-3">
        <span id="syncStatus" class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-medium bg-emerald-50 text-emerald-700 border border-emerald-200">
          <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
          Conectado
        </span>
        <button onclick="fetchTransactions()" title="Recarregar Dados" class="p-2 text-slate-500 hover:text-brand-600 hover:bg-slate-100 rounded-lg transition">
          <i data-lucide="refresh-cw" class="w-4 h-4"></i>
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-6 space-y-6">

    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
      <div class="glass-card p-5 rounded-2xl shadow-sm">
        <div class="flex items-center justify-between">
          <span class="text-xs font-semibold text-slate-500 uppercase tracking-wider">Receitas</span>
          <div class="p-2 bg-emerald-50 text-emerald-600 rounded-lg">
            <i data-lucide="trending-up" class="w-4 h-4"></i>
          </div>
        </div>
        <div class="mt-2">
          <h2 id="totalIncome" class="text-2xl font-bold text-slate-900">R$ 0,00</h2>
        </div>
      </div>

      <div class="glass-card p-5 rounded-2xl shadow-sm">
        <div class="flex items-center justify-between">
          <span class="text-xs font-semibold text-slate-500 uppercase tracking-wider">Despesas</span>
          <div class="p-2 bg-rose-50 text-rose-600 rounded-lg">
            <i data-lucide="trending-down" class="w-4 h-4"></i>
          </div>
        </div>
        <div class="mt-2">
          <h2 id="totalExpense" class="text-2xl font-bold text-slate-900">R$ 0,00</h2>
        </div>
      </div>

      <div class="glass-card p-5 rounded-2xl shadow-sm">
        <div class="flex items-center justify-between">
          <span class="text-xs font-semibold text-slate-500 uppercase tracking-wider">Saldo Concluído</span>
          <div class="p-2 bg-brand-50 text-brand-600 rounded-lg">
            <i data-lucide="dollar-sign" class="w-4 h-4"></i>
          </div>
        </div>
        <div class="mt-2">
          <h2 id="totalBalance" class="text-2xl font-bold text-slate-900">R$ 0,00</h2>
        </div>
      </div>

      <div class="glass-card p-5 rounded-2xl shadow-sm">
        <div class="flex items-center justify-between">
          <span class="text-xs font-semibold text-slate-500 uppercase tracking-wider">Pendente (A Pagar/Receber)</span>
          <div class="p-2 bg-amber-50 text-amber-600 rounded-lg">
            <i data-lucide="clock" class="w-4 h-4"></i>
          </div>
        </div>
        <div class="mt-2">
          <h2 id="totalPending" class="text-2xl font-bold text-amber-600">R$ 0,00</h2>
        </div>
      </div>
    </div>

    <div class="glass-card p-5 rounded-2xl shadow-sm">
      <h3 class="text-sm font-bold text-slate-800 mb-4 flex items-center gap-2">
        <i data-lucide="plus-circle" class="w-4 h-4 text-brand-600"></i>
        Novo Lançamento
      </h3>
      <form id="transactionForm" onsubmit="handleAddTransaction(event)" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-7 gap-3">
        <div class="lg:col-span-2">
          <label class="block text-xs font-medium text-slate-600 mb-1">Descrição</label>
          <input type="text" id="descInput" required placeholder="Ex: Supermercado" class="w-full px-3 py-2 text-sm border border-slate-200 rounded-xl focus:ring-2 focus:ring-brand-500 focus:outline-none">
        </div>

        <div>
          <label class="block text-xs font-medium text-slate-600 mb-1">Valor (R$)</label>
          <input type="number" step="0.01" id="amountInput" required placeholder="0,00" class="w-full px-3 py-2 text-sm border border-slate-200 rounded-xl focus:ring-2 focus:ring-brand-500 focus:outline-none">
        </div>

        <div>
          <label class="block text-xs font-medium text-slate-600 mb-1">Tipo</label>
          <select id="typeInput" class="w-full px-3 py-2 text-sm border border-slate-200 rounded-xl focus:ring-2 focus:ring-brand-500 focus:outline-none">
            <option value="expense">Despesa</option>
            <option value="income">Receita</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-medium text-slate-600 mb-1">Categoria</label>
          <select id="categoryInput" class="w-full px-3 py-2 text-sm border border-slate-200 rounded-xl focus:ring-2 focus:ring-brand-500 focus:outline-none">
            <option value="Alimentação">Alimentação</option>
            <option value="Moradia">Moradia</option>
            <option value="Transporte">Transporte</option>

            <option value="Lazer">Lazer</option>
            <option value="Saúde">Saúde</option>
            <option value="Salário">Salário</option>
            <option value="Investimentos">Investimentos</option>
            <option value="Outros">Outros</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-medium text-slate-600 mb-1">Data</label>
          <input type="date" id="dateInput" required class="w-full px-3 py-2 text-sm border border-slate-200 rounded-xl focus:ring-2 focus:ring-brand-500 focus:outline-none">
        </div>

        <div class="flex items-end gap-2">
          <button type="submit" class="w-full bg-brand-600 hover:bg-brand-700 text-white font-medium py-2 px-4 rounded-xl text-sm transition shadow-md shadow-brand-500/20 flex items-center justify-center gap-1.5">
            <i data-lucide="plus" class="w-4 h-4"></i>
            Adicionar
          </button>
        </div>
      </form>
    </div>

    <div class="glass-card p-4 rounded-2xl shadow-sm flex flex-wrap items-center justify-between gap-4">
      <div class="flex flex-wrap items-center gap-3 w-full lg:w-auto">
        <input type="text" id="searchInput" oninput="render()" placeholder="Buscar lançamento..." class="px-3 py-1.5 text-sm border border-slate-200 rounded-xl focus:ring-2 focus:ring-brand-500 focus:outline-none w-full sm:w-48">
        
        <select id="filterType" onchange="render()" class="px-3 py-1.5 text-sm border border-slate-200 rounded-xl focus:ring-2 focus:ring-brand-500 focus:outline-none">
          <option value="all">Todos os Tipos</option>
          <option value="expense">Apenas Despesas</option>
          <option value="income">Apenas Receitas</option>
        </select>

        <select id="filterStatus" onchange="render()" class="px-3 py-1.5 text-sm border border-slate-200 rounded-xl focus:ring-2 focus:ring-brand-500 focus:outline-none">
          <option value="all">Todos os Status</option>
          <option value="paid">Concluídos/Pagos</option>
          <option value="pending">Pendentes</option>
        </select>
      </div>

      <div class="flex items-center gap-2">
        <button onclick="exportToExcel()" class="px-3 py-1.5 border border-slate-200 hover:bg-slate-100 text-slate-700 text-sm font-medium rounded-xl transition flex items-center gap-1.5">
          <i data-lucide="download" class="w-4 h-4"></i>
          Exportar Excel
        </button>
      </div>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">

      <div class="lg:col-span-2 glass-card rounded-2xl shadow-sm overflow-hidden flex flex-col">
        <div class="p-4 border-b border-slate-100 flex items-center justify-between">
          <h3 class="font-bold text-slate-800 text-sm flex items-center gap-2">
            <i data-lucide="list" class="w-4 h-4 text-brand-600"></i>
            Lançamentos
          </h3>
          <span id="itemCount" class="text-xs font-semibold px-2 py-0.5 bg-slate-100 text-slate-600 rounded-full">0 itens</span>
        </div>

        <div class="overflow-x-auto flex-1">
          <table class="w-full text-left text-xs border-collapse">
            <thead>
              <tr class="bg-slate-50 text-slate-500 uppercase font-semibold border-b border-slate-100">
                <th class="p-3">Data</th>
                <th class="p-3">Descrição</th>
                <th class="p-3">Categoria</th>
                <th class="p-3">Valor</th>
                <th class="p-3 text-center">Status</th>
                <th class="p-3 text-right">Ações</th>
              </tr>
            </thead>
            <tbody id="transactionList" class="divide-y divide-slate-100">
              </tbody>
          </table>
        </div>
      </div>

      <div class="glass-card p-5 rounded-2xl shadow-sm flex flex-col">
        <h3 class="font-bold text-slate-800 text-sm mb-4 flex items-center gap-2">
          <i data-lucide="pie-chart" class="w-4 h-4 text-brand-600"></i>
          Despesas por Categoria
        </h3>
        <div class="flex-1 min-h-[260px] relative flex items-center justify-center">
          <canvas id="expensesChart"></canvas>
        </div>
      </div>

    </div>
  </main>

  <script>
    // CONFIGURAÇÃO DO SUPABASE
    // (Substitua caso utilize suas próprias chaves)
    const SUPABASE_URL = 'https://YOUR_SUPABASE_PROJECT_ID.supabase.co'; 
    const SUPABASE_KEY = 'YOUR_SUPABASE_ANON_KEY';
    
    let supabaseClient = null;
    if (typeof supabase !== 'undefined' && SUPABASE_URL.indexOf('YOUR_SUPABASE') === -1) {
      supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    }

    // ESTADO LOCAL EM MEMÓRIA
    let transactions = [];
    let expensesChart = null;

    // INICIALIZAÇÃO
    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('dateInput').valueAsDate = new Date();
      fetchTransactions();
    });

    // BUSCA INICIAL DOS DADOS
    async function fetchTransactions() {
      const syncEl = document.getElementById('syncStatus');
      syncEl.innerText = 'Carregando...';

      if (!supabaseClient) {
        // Dados de demonstração caso o Supabase não esteja configurado
        transactions = getMockData();
        render();
        syncEl.innerText = 'Modo Demo (Sem BD)';
        return;
      }

      try {
        const { data, error } = await supabaseClient
          .from('transactions')
          .select('*')
          .order('date', { ascending: false });

        if (error) throw error;

        transactions = data || [];
        render();
        syncEl.innerText = 'Conectado';
      } catch (err) {
        console.error('Erro ao buscar lançamentos:', err);
        syncEl.innerText = 'Erro na Conexão';
      }
    }

    // ⚡ 1. CONFIRMAÇÃO RÁPIDA / ALTERAÇÃO DE STATUS (OPTIMISTIC UI)
    async function togglePaidStatus(id) {
      const index = transactions.findIndex(t => t.id === id);
      if (index === -1) return;

      const item = transactions[index];
      const previousStatus = item.is_paid;
      const newStatus = !previousStatus;

      // 1. Atualiza no estado local IMEDIATAMENTE (0ms lag)
      transactions[index].is_paid = newStatus;
      
      // 2. Renderiza a tela na hora
      render();

      // 3. Atualiza no Supabase em segundo plano sem travar a interface
      if (supabaseClient) {
        try {
          const { error } = await supabaseClient
            .from('transactions')
            .update({ is_paid: newStatus })
            .eq('id', id);

          if (error) throw error;
        } catch (err) {
          console.error('Erro ao atualizar status no servidor:', err);
          // Reverte o estado caso falhe no banco
          transactions[index].is_paid = previousStatus;
          render();
          alert('Erro ao sincronizar status com o servidor. Ação revertida.');
        }
      }
    }

    // ⚡ 2. EXCLUSÃO RÁPIDA (OPTIMISTIC UI)
    async function deleteTransaction(id) {
      const index = transactions.findIndex(t => t.id === id);
      if (index === -1) return;

      const item = transactions[index];

      // Trava de segurança opcional se já estiver pago
      if (item.is_paid) {
        if (!confirm('Este lançamento já consta como CONCLUÍDO. Deseja mesmo excluí-lo?')) {
          return;
        }
      } else {
        if (!confirm(`Deseja mesmo excluir "${item.description}"?`)) return;
      }

      // Salva uma cópia do item para rollback
      const removedItem = transactions[index];
      const removedIndex = index;

      // 1. Remove do array local IMEDIATAMENTE
      transactions.splice(index, 1);

      // 2. Re-renderiza a tela na hora
      render();

      // 3. Deleta no banco em segundo plano
      if (supabaseClient) {
        try {
          const { error } = await supabaseClient
            .from('transactions')
            .delete()
            .eq('id', id);

          if (error) throw error;
        } catch (err) {
          console.error('Erro ao excluir no servidor:', err);
          // Reverte re-inserindo o item se houver falha
          transactions.splice(removedIndex, 0, removedItem);
          render();
          alert('Não foi possível excluir o item do servidor. O lançamento foi restaurado.');
        }
      }
    }

    // ADICIONAR NOVO LANÇAMENTO
    async function handleAddTransaction(e) {
      e.preventDefault();

      const description = document.getElementById('descInput').value.trim();
      const amount = parseFloat(document.getElementById('amountInput').value);
      const type = document.getElementById('typeInput').value;
      const category = document.getElementById('categoryInput').value;
      const date = document.getElementById('dateInput').value;

      if (!description || isNaN(amount) || !date) return;

      const tempId = 'temp-' + Date.now();
      const newTx = {
        id: tempId,
        description,
        amount,
        type,
        category,
        date,
        is_paid: false
      };

      // Inclusão otimista
      transactions.unshift(newTx);
      render();

      // Reset do formulário
      document.getElementById('descInput').value = '';
      document.getElementById('amountInput').value = '';

      if (supabaseClient) {
        try {
          const { data, error } = await supabaseClient
            .from('transactions')
            .insert([{ description, amount, type, category, date, is_paid: false }])
            .select();

          if (error) throw error;

          if (data && data[0]) {
            const idx = transactions.findIndex(t => t.id === tempId);
            if (idx !== -1) transactions[idx] = data[0];
            render();
          }
        } catch (err) {
          console.error('Erro ao salvar lançamento:', err);
          transactions = transactions.filter(t => t.id !== tempId);
          render();
          alert('Erro ao salvar novo lançamento no servidor.');
        }
      }
    }

    // RENDERIZAÇÃO DA TELA E CÁLCULOS
    function render() {
      const search = document.getElementById('searchInput').value.toLowerCase();
      const filterType = document.getElementById('filterType').value;
      const filterStatus = document.getElementById('filterStatus').value;

      // Filtragem local instantânea
      const filtered = transactions.filter(t => {
        const matchesSearch = t.description.toLowerCase().includes(search) || t.category.toLowerCase().includes(search);
        const matchesType = filterType === 'all' || t.type === filterType;
        let matchesStatus = true;
        if (filterStatus === 'paid') matchesStatus = t.is_paid === true;
        if (filterStatus === 'pending') matchesStatus = t.is_paid === false;

        return matchesSearch && matchesType && matchesStatus;
      });

      // Cálculos de Resumo
      let totalIncome = 0;
      let totalExpense = 0;
      let totalPending = 0;
      const categoryTotals = {};

      filtered.forEach(t => {
        const val = Number(t.amount) || 0;
        
        if (t.type === 'income') {
          if (t.is_paid) totalIncome += val;
          else totalPending += val;
        } else {
          if (t.is_paid) {
            totalExpense += val;
            categoryTotals[t.category] = (categoryTotals[t.category] || 0) + val;
          } else {
            totalPending -= val;
          }
        }
      });

      const totalBalance = totalIncome - totalExpense;

      // Atualiza KPI Cards
      document.getElementById('totalIncome').innerText = formatBRL(totalIncome);
      document.getElementById('totalExpense').innerText = formatBRL(totalExpense);
      document.getElementById('totalBalance').innerText = formatBRL(totalBalance);
      document.getElementById('totalPending').innerText = formatBRL(totalPending);
      document.getElementById('itemCount').innerText = `${filtered.length} itens`;

      // Renderiza Tabela
      renderList(filtered);

      // Renderiza/Atualiza Gráfico
      renderCategoryChart(categoryTotals);

      // Atualiza ícones Lucide
      if (typeof lucide !== 'undefined') {
        lucide.createIcons();
      }
    }

    // RENDERIZA TABELA DE LANÇAMENTOS
    function renderList(items) {
      const listEl = document.getElementById('transactionList');
      listEl.innerHTML = '';

      if (items.length === 0) {
        listEl.innerHTML = `
          <tr>
            <td colspan="6" class="p-8 text-center text-slate-400">
              Nenhum lançamento encontrado.
            </td>
          </tr>
        `;
        return;
      }

      items.forEach(t => {
        const tr = document.createElement('tr');
        tr.className = 'hover:bg-slate-50/80 transition-colors';

        const isPaid = !!t.is_paid;
        const formattedDate = formatDate(t.date);
        const formattedAmount = formatBRL(t.amount);

        tr.innerHTML = `
          <td class="p-3 text-slate-500 whitespace-nowrap">${formattedDate}</td>
          <td class="p-3 font-medium text-slate-800">${escapeHtml(t.description)}</td>
          <td class="p-3">
            <span class="inline-flex items-center px-2 py-0.5 rounded-md text-[11px] font-medium bg-slate-100 text-slate-600">
              ${escapeHtml(t.category)}
            </span>
          </td>
          <td class="p-3 font-semibold ${t.type === 'income' ? 'text-emerald-600' : 'text-slate-800'}">
            ${t.type === 'income' ? '+' : '-'} ${formattedAmount}
          </td>
          <td class="p-3 text-center">
            <button 
              onclick="togglePaidStatus('${t.id}')"
              title="${isPaid ? 'Clique para marcar como Pendente' : 'Clique para marcar como Pago/Concluído'}"
              class="inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-[11px] font-semibold transition ${
                isPaid 
                  ? 'bg-emerald-100 text-emerald-800 hover:bg-emerald-200' 
                  : 'bg-amber-100 text-amber-800 hover:bg-amber-200'
              }">
              <i data-lucide="${isPaid ? 'check-circle-2' : 'clock'}" class="w-3 h-3"></i>
              ${isPaid ? 'Concluído' : 'Pendente'}
            </button>
          </td>
          <td class="p-3 text-right">
            <button 
              onclick="deleteTransaction('${t.id}')"
              title="Excluir Lançamento" 
              class="p-1.5 rounded-lg text-slate-400 hover:bg-rose-50 hover:text-rose-600 transition">
              <i data-lucide="trash-2" class="w-4 h-4"></i>
            </button>
          </td>
        `;

        listEl.appendChild(tr);
      });
    }

    // ⚡ 3. RENDERIZAÇÃO EFICIENTE DO GRÁFICO (SEM DESTRIUIR/RECRIAR INSTÂNCIA)
    function renderCategoryChart(categoryTotals) {
      const ctx = document.getElementById('expensesChart');
      if (!ctx) return;

      const labels = Object.keys(categoryTotals);
      const dataValues = Object.values(categoryTotals);

      if (labels.length === 0) {
        if (expensesChart) {
          expensesChart.destroy();
          expensesChart = null;
        }
        return;
      }

      const colors = [
        '#10b981', '#f43f5e', '#6366f1', '#f59e0b', 
        '#8b5cf6', '#06b6d4', '#ec4899', '#84cc16'
      ];

      if (expensesChart) {
        // Atualização em memória ultrarrápida sem animações pesadas
        expensesChart.data.labels = labels;
        expensesChart.data.datasets[0].data = dataValues;
        expensesChart.update('none');
      } else {
        expensesChart = new Chart(ctx.getContext('2d'), {
          type: 'doughnut',
          data: {
            labels: labels,
            datasets: [{
              data: dataValues,
              backgroundColor: colors.slice(0, Math.max(labels.length, 8)),
              borderWidth: 2,
              borderColor: '#ffffff'
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: {
                position: 'bottom',
                labels: {
                  boxWidth: 12,
                  font: { size: 11 }
                }
              }
            }
          }
        });
      }
    }

    // EXPORTAR PARA EXCEL
    function exportToExcel() {
      if (transactions.length === 0) {
        alert('Nenhum dado para exportar.');
        return;
      }
      const dataToExport = transactions.map(t => ({
        Data: formatDate(t.date),
        Descrição: t.description,
        Categoria: t.category,
        Tipo: t.type === 'income' ? 'Receita' : 'Despesa',
        Valor: t.amount,
        Status: t.is_paid ? 'Concluído' : 'Pendente'
      }));

      const ws = XLSX.utils.json_to_sheet(dataToExport);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, "Lançamentos");
      XLSX.writeFile(wb, "controle_financeiro.xlsx");
    }

    // FUNÇÕES AUXILIARES
    function formatBRL(value) {
      return new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(value || 0);
    }

    function formatDate(dateStr) {
      if (!dateStr) return '';
      const parts = dateStr.split('-');
      if (parts.length === 3) return `${parts[2]}/${parts[1]}/${parts[0]}`;
      return dateStr;
    }

    function escapeHtml(str) {
      return (str || '').replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }
